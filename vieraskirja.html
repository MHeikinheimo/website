      <p class="blog-intro">

        Vieraskirja on paikka, jossa fanit ja katsojat voivat jättää viestejä,

      </p>

      <!-- GUESTBOOK -->

      <div class="guestbook-box">

        <form id="guestbook-form">

          <input
            type="text"
            id="message"
            placeholder="Kirjoita viesti..."

  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSyBd1Gn0OgJlh7I4hD_ir9lNvwO7lPOAe4",

      authDomain: "yangfdragon-visitors.firebaseapp.com",

      projectId: "yangfdragon-visitors",

      storageBucket: "yangfdragon-visitors.firebasestorage.app",

      messagingSenderId: "708677263012",

      appId: "1:708677263012:web:83fef40b10bcb66c23d031"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const form = document.getElementById("guestbook-form");

    const messageInput = document.getElementById("message");

    const messagesDiv = document.getElementById("messages");

    /* SEND MESSAGE */

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const text = messageInput.value.trim();

      if(text === "") return;

      await addDoc(collection(db, "guestbook"), {

        text: text,

        created: serverTimestamp()

      });

      messageInput.value = "";

    });

    /* LOAD MESSAGES */

    const q = query(

      collection(db, "guestbook"),

      orderBy("created", "desc")

    );

    onSnapshot(q, (snapshot) => {

      messagesDiv.innerHTML = "";

      snapshot.forEach((doc) => {

        const data = doc.data();

        messagesDiv.innerHTML += `

          <div class="guestbook-message">

            ${data.text}

          </div>

        `;

      });

    });

  </script>
